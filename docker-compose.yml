version: "3.8"

services:
  web:
    build: .
    container_name: invoice_automation_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./invoices.db
      - LLM_PROVIDER=mock
      - EMAIL_SOURCE=mock
      - PO_TOLERANCE_PERCENTAGE=2.0
      - DEBUG=True
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./invoices.db:/app/invoices.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

